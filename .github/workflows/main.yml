
name: Daily K-means Virtual Portfolio

on:
  schedule:
    - cron: "15 15 * * *"
      timezone: "America/Chicago"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-virtual-portfolio
  cancel-in-progress: false

jobs:
  market-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download Alpaca market data
        env:
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
        run: python fetch_data.py

      - name: Run K-means analysis
        run: python kmeans_market_model.py

      - name: Run daily virtual portfolio
        run: python daily_simulator.py

      - name: Generate portfolio report
        run: python portfolio_report.py

      - name: Save virtual portfolio state to GitHub
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update daily virtual portfolio"
          file_pattern: portfolio_state.json

      - name: Save daily reports
        uses: actions/upload-artifact@v4
        with:
          name: daily-virtual-portfolio
          path: |
            portfolio_state.json
            alpaca_hsy_mcd.csv
            kmeans_clustered_data.csv
            kmeans_market_clusters.png
          if-no-files-found: error
          retention-days: 90
