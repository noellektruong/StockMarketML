
name: Daily K-means Market Analysis

on:
  schedule:
    - cron: "0 15 * * *"
      timezone: "America/Chicago"
  workflow_dispatch:

jobs:
  market-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download Alpaca market data
        env:
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
        run: python fetch_data.py

      - name: Run K-means analysis
        run: python kmeans_market_model.py

      - name: Save analysis results
        uses: actions/upload-artifact@v4
        with:
          name: daily-kmeans-results
          path: |
            alpaca_hsy_mcd.csv
            kmeans_clustered_data.csv
            kmeans_market_clusters.png
          if-no-files-found: error
          retention-days: 30
